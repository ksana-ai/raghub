services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: raghub
      POSTGRES_USER: raghub
      POSTGRES_PASSWORD: raghub
    ports:
      - "${RAGHUB_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raghub -d raghub"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - raghub-postgres:/var/lib/postgresql/data

  raghub:
    profiles: [app]
    build: .
    command: ["-migrate"]
    environment:
      RAGHUB_DATABASE_URL: postgres://raghub:raghub@postgres:5432/raghub?sslmode=disable
      RAGHUB_EMBEDDING_ENDPOINT: ${RAGHUB_EMBEDDING_ENDPOINT:-http://host.docker.internal:1234/v1/embeddings}
      RAGHUB_EMBEDDING_MODEL: ${RAGHUB_EMBEDDING_MODEL:-text-embedding-bge-m3}
      RAGHUB_EMBEDDING_DIMENSIONS: ${RAGHUB_EMBEDDING_DIMENSIONS:-1024}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RAGHUB_API_PORT:-8080}:8080"

volumes:
  raghub-postgres:
